name: theo's day notifications

on:
  schedule:
    # hourly — the script decides whether it's a send hour in your timezone
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Send one now (morning or evening)'
        required: false
        default: 'morning'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install web-push --no-save

      - run: node scripts/notify.js
        env:
          GIST_OWNER: ${{ secrets.GIST_OWNER }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          FORCE_SLOT: ${{ github.event.inputs.slot }}
