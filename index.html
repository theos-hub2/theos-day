<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>theo's day</title>

  <!-- ── PWA ── -->
  <link rel="manifest" href="./manifest.webmanifest"/>
  <meta name="theme-color" content="#e8e8e4"/>
  <meta name="description" content="Daily task tracker and 2026 resolutions."/>

  <!-- ── iOS home screen ── -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="theo's day"/>
  <link rel="apple-touch-icon" href="./icon-180.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png"/>
  <link rel="apple-touch-icon" sizes="167x167" href="./icon-167.png"/>
  <link rel="apple-touch-icon" sizes="152x152" href="./icon-152.png"/>
  <link rel="apple-touch-icon" sizes="120x120" href="./icon-120.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png"/>

  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --white:      #fafaf8;
      --off-white:  #f5f5f2;
      --green:      #1a4d2e;
      --green-mid:  #2d6a4f;
      --green-light:#52b788;
      --green-pale: #95d5b2;
      --ink:        #1a1a1a;
      --ink-mid:    #4a4a4a;
      --muted:      #7a7a7a;
      --border:     #d0d0cc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      -webkit-text-size-adjust: 100%;
      background: #e8e8e4;
    }

    body {
      font-family: 'EB Garamond', serif;
      background: #e8e8e4;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 30px 24px 60px;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    .page {
      width: 100%;
      max-width: 560px;
      background: var(--white);
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    .screens {
      flex: 1;
      padding: 0 18px;
      /* clear the fixed tab bar */
      padding-bottom: calc(64px + env(safe-area-inset-bottom) + 20px);
    }

    /* ── BOTTOM TAB BAR ── */
    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 200;
      display: flex;
      background: var(--white);
      border-top: 1.5px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tabbtn {
      flex: 1;
      height: 56px;
      background: transparent;
      border: none;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.18s ease;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    .tabbtn svg {
      width: 25px;
      height: 25px;
      stroke: currentColor;
      stroke-width: 1.7;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tabbtn.active { color: var(--green); }
    .tabbtn.active svg { stroke-width: 2.1; }
    .tabbtn.active::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 26px;
      height: 2.5px;
      background: var(--green);
    }
    .tabbtn:active { color: var(--green-mid); }

    /* ── SCREEN HEADERS ── */
    .screen-title {
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--green);
      letter-spacing: -0.01em;
      padding-top: 18px;
      margin-bottom: 4px;
    }
    .today-header { padding-top: 18px; margin-bottom: 14px; }    .today-wordmark {
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--green);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .today-date {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 7px;
    }

    body { padding: 0; }

    @media (min-width: 561px) {
      body { padding: 24px 0 0; background: #e8e8e4; }
      .page { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
      .tabbar { max-width: 560px; left: 50%; transform: translateX(-50%); }
    }

    /* iOS zooms the whole page when you focus an input under 16px. */
    input, select, textarea, button { font-size: 16px; }

    /* ── LAUNCHED FROM THE HOME SCREEN ── */
    @media (display-mode: standalone) {
      .page {
        padding-top: env(safe-area-inset-top);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    }

    /* ── META BAR ── */

    /* ── SIDEBAR CONTENT ── */

    /* ── TITLE ── */


    
    


    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 24px;
    }
    .divider-thin {
      height: 1px;
      background: var(--border);
      margin: 0 24px;
    }

    /* ── CONTENT ── */
    .content {
      padding: 20px 24px 28px;
    }

    /* ── TABS ── */

    .panel { display: none; }
    .panel.active { display: block; }

    /* ── PROGRESS ── */
    .progress-block {
      margin-bottom: 20px;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .progress-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green);
    }
    .progress-pct {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--green);
      line-height: 1;
      transition: transform 0.1s ease, color 0.3s ease;
    }
    .progress-pct.celebrating {
      animation: pulsePct 0.4s ease-in-out infinite;
    }
    @keyframes pulsePct {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    .progress-pct.rainbow {
      animation: rainbowText 1.5s linear infinite;
    }
    @keyframes rainbowText {
      0% { color: #1a4d2e; }
      14% { color: #2d6a4f; }
      28% { color: #52b788; }
      42% { color: #95d5b2; }
      56% { color: #40916c; }
      70% { color: #2d6a4f; }
      84% { color: #1b4332; }
      100% { color: #1a4d2e; }
    }
    .bar-track {
      width: 100%;
      height: 14px;
      background: var(--off-white);
      border: 2px solid var(--green);
      position: relative;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.5s cubic-bezier(.34,1.2,.64,1), background 0.5s ease;
    }
    .bar-fill.celebrating {
      animation: pulseBar 0.4s ease-in-out infinite;
    }
    @keyframes pulseBar {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.4); }
    }
    .bar-fill.rainbow {
      animation: rainbowBg 1.5s linear infinite;
    }
    @keyframes rainbowBg {
      0% { background: #1a4d2e; }
      14% { background: #2d6a4f; }
      28% { background: #52b788; }
      42% { background: #95d5b2; }
      56% { background: #40916c; }
      70% { background: #2d6a4f; }
      84% { background: #1b4332; }
      100% { background: #1a4d2e; }
    }
    .completion-msg {
      text-align: center;
      margin-top: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      font-style: italic;
      letter-spacing: 0.08em;
      color: var(--green);
      display: none;
      animation: fadeIn 0.4s ease;
    }
    /* ── STREAKS ── */
.streak-block {
  margin-bottom: 20px;
  background: var(--off-white);
  border: 1.5px solid var(--border);
  border-radius: 4px;
  padding: 16px 18px;
}
.streak-header {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 12px;
}
.streak-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.streak-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 3px;
}
.streak-name {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--ink);
}
.streak-count {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--green);
  display: flex;
  align-items: center;
  gap: 4px;
}
.streak-count::before {
  content: '🔥';
  font-size: 1rem;
}
.streak-empty {
  text-align: center;
  padding: 20px;
  color: var(--muted);
  font-size: 0.85rem;
  font-style: italic;
}

/* ── CHESS RATING ── */
.chess-block {
  margin-bottom: 20px;
  background: var(--off-white);
  border: 1.5px solid var(--border);
  border-radius: 4px;
  padding: 16px 18px;
}
.chess-header {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.chess-header::before {
  content: '♟';
  font-size: 1rem;
}
.chess-rating-display {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.chess-rating-number {
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--ink);
  line-height: 1;
}
.chess-rating-label {
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.chess-record {
  margin-top: 10px;
  font-size: 0.78rem;
  color: var(--ink-mid);
  display: flex;
  gap: 12px;
}
.chess-record span {
  font-weight: 600;
}
.chess-peak {
  margin-top: 6px;
  font-size: 0.75rem;
  color: var(--muted);
  font-style: italic;
}
.chess-loading {
  text-align: center;
  padding: 12px;
  color: var(--muted);
  font-size: 0.82rem;
  font-style: italic;
}
.chess-error {
  text-align: center;
  padding: 12px;
  color: var(--muted);
  font-size: 0.82rem;
  font-style: italic;
}
/* ── OMELETTE COUNTER ── */

/* ── RESOLUTIONS ── */
.res-add-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
}
.res-add-line2 {
  display: flex;
  gap: 8px;
}
.res-add-row input[type="text"] {
  width: 100%;
  padding: 11px 14px;
  border: 2px solid var(--green);
  background: var(--white);
  color: var(--ink);
  font-family: 'EB Garamond', serif;
  font-weight: 500;
  outline: none;
  transition: all 0.2s;
}
.res-add-row input[type="text"]:focus { background: var(--off-white); border-color: var(--green-mid); }
.res-add-row input[type="text"]::placeholder { color: var(--muted); font-weight: 400; }
.res-add-row select {
  flex: 1;
  min-width: 0;
  padding: 11px 8px;
  border: 2px solid var(--green);
  background: var(--white);
  color: var(--ink);
  font-family: 'EB Garamond', serif;
  font-weight: 600;
  outline: none;
  cursor: pointer;
}
.res-add-row input[type="number"] {
  width: 82px;
  flex-shrink: 0;
  padding: 11px 6px;
  border: 2px solid var(--green);
  background: var(--white);
  color: var(--ink);
  font-family: 'EB Garamond', serif;
  font-weight: 500;
  outline: none;
  text-align: center;
}
.res-add-row input[type="number"]::placeholder { color: var(--muted); }
.res-add-row .btn-add {
  flex-shrink: 0;
  border-left: 2px solid var(--green);
}
.res-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.res-item {
  background: var(--off-white);
  border: 1.5px solid var(--border);
  border-left: 3px solid var(--green);
  padding: 16px 18px;
  transition: all 0.2s;
  animation: slideIn 0.2s ease forwards;
}
.res-item:hover {
  border-left-color: var(--green-mid);
  background: var(--white);
}
.res-item.completed {
  border-left-color: var(--green-light);
}
.res-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.res-item-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--ink);
}
.res-item.completed .res-item-title {
  color: var(--green);
}
.res-item-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}
.res-btn {
  width: 28px;
  height: 28px;
  border: 1.5px solid var(--green);
  background: transparent;
  color: var(--green);
  font-family: 'EB Garamond', serif;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 2px;
  transition: all 0.2s;
}
.res-btn:hover {
  background: var(--green);
  color: var(--white);
}
.res-btn-del {
  background: transparent;
  color: var(--muted);
  border: none;
  font-size: 0.9rem;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  flex-shrink: 0;
  border-radius: 2px;
}
.res-btn-del:hover {
  color: var(--green);
  background: rgba(26,77,46,0.08);
}
.res-progress-info {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--ink-mid);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}
.res-progress-pct {
  color: var(--green);
}
.res-bar-track {
  width: 100%;
  height: 10px;
  background: var(--white);
  border: 1.5px solid var(--border);
  overflow: hidden;
}
.res-bar-fill {
  height: 100%;
  transition: width 0.5s cubic-bezier(.34,1.2,.64,1), background 0.5s ease;
}
.res-onetime-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.res-cb {
  width: 22px;
  height: 22px;
  border: 2px solid var(--green);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.3s ease;
  color: var(--white);
  font-size: 12px;
  font-weight: 700;
  border-radius: 2px;
}
.res-cb:hover {
  background: rgba(26,77,46,0.08);
}
.res-item.completed .res-cb {
  background: var(--green);
  border-color: var(--green);
}
.res-type-tag {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-left: 8px;
}
.res-evolve-btn {
  margin-top: 10px;
  padding: 7px 14px;
  border: 1.5px solid var(--green);
  background: transparent;
  color: var(--green);
  font-family: 'EB Garamond', serif;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 2px;
}
.res-evolve-btn:hover {
  background: var(--green);
  color: var(--white);
}
.res-evolve-form {
  margin-top: 10px;
  display: flex;
  gap: 0;
}
.res-evolve-form input[type="text"] {
  flex: 1;
  padding: 8px 12px;
  border: 1.5px solid var(--green);
  background: var(--white);
  color: var(--ink);
  font-family: 'EB Garamond', serif;
  font-size: 0.88rem;
  font-weight: 500;
  outline: none;
}
.res-evolve-form input[type="number"] {
  padding: 8px;
  border: 1.5px solid var(--green);
  border-left: none;
  background: var(--white);
  color: var(--ink);
  font-family: 'EB Garamond', serif;
  font-size: 0.88rem;
  font-weight: 500;
  outline: none;
  width: 65px;
  text-align: center;
}
.res-evolve-form button {
  padding: 8px 14px;
  border: 1.5px solid var(--green);
  border-left: none;
  background: var(--green);
  color: var(--white);
  font-family: 'EB Garamond', serif;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
}
.res-evolve-form button:hover {
  background: var(--green-mid);
}
.res-history {
  margin-top: 10px;
  padding-left: 4px;
  border-left: 2px solid var(--green-pale);
}
.res-history-item {
  padding: 5px 0 5px 12px;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--green);
  display: flex;
  align-items: center;
  gap: 8px;
}
.res-history-item::before {
  content: '✓';
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--green-light);
}
.res-history-item .res-history-target {
  color: var(--muted);
  font-size: 0.75rem;
  font-style: italic;
}
.res-overall {
  margin-bottom: 20px;
  padding: 14px 18px;
  background: var(--off-white);
  border: 1.5px solid var(--border);
  border-radius: 4px;
}
.res-overall-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}
.res-overall-label {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--green);
}
.res-overall-pct {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--green);
}

/* ── SYNC SCREEN ── */
.sync-blurb {
  font-size: 0.88rem;
  color: var(--ink-mid);
  line-height: 1.5;
  margin: 6px 0 18px;
}
.sync-block {
  background: var(--off-white);
  border: 1.5px solid var(--border);
  border-radius: 4px;
  padding: 16px 18px;
  margin-bottom: 16px;
}
.sync-label {
  display: block;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 6px;
}
.sync-block input {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid var(--green);
  background: var(--white);
  color: var(--ink);
  font-family: 'EB Garamond', serif;
  font-weight: 500;
  outline: none;
  margin-bottom: 14px;
}
.sync-block input::placeholder { color: var(--muted); font-weight: 400; }
.sync-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.sync-btn {
  padding: 10px 14px;
  border: 2px solid var(--green);
  background: transparent;
  color: var(--green);
  font-family: 'EB Garamond', serif;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 2px;
}
.sync-btn:active { background: var(--green); color: var(--white); }
.sync-status {
  margin-top: 14px;
  font-size: 0.82rem;
  color: var(--ink-mid);
  font-style: italic;
  line-height: 1.4;
}
.sync-status.ok { color: var(--green); font-style: normal; }
.sync-status.err { color: #c0392b; font-style: normal; }
.sync-url {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 0.72rem;
  color: var(--ink-mid);
  background: var(--white);
  border: 1.5px solid var(--border);
  padding: 10px;
  border-radius: 3px;
  word-break: break-all;
  margin-bottom: 12px;
  line-height: 1.4;
}

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── QUOTE OVERLAY ── */
    .quote-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(26, 77, 46, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeInOverlay 0.5s ease;
      padding: 40px;
    }
    @keyframes fadeInOverlay {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .quote-content {
      text-align: center;
      color: var(--white);
      max-width: 600px;
    }
    .quote-text {
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 500;
      font-style: italic;
      line-height: 1.5;
      margin-bottom: 20px;

<script>
  // Normalize task name for streak comparison
  function normalizeTaskName(name) {
    return name.toLowerCase().trim();
  }

  // Calculate streaks
  function calculateStreaks() {
    const data = loadData();
    const taskNames = new Map();
    
    Object.values(data).forEach(day => {
      if (day.tasks) {
        day.tasks.forEach(task => {
          const normalized = normalizeTaskName(task.text);
          if (!taskNames.has(normalized)) {
            taskNames.set(normalized, task.text);
          }
        });
      }
    });
    
    const streaks = {};
    
    taskNames.forEach((displayName, normalizedName) => {
      let currentStreak = 0;
      let checkDate = new Date();
      
      while (true) {
        const dateKey = `${checkDate.getFullYear()}-${String(checkDate.getMonth()+1).padStart(2,'0')}-${String(checkDate.getDate()).padStart(2,'0')}`;
        
        const dayData = data[dateKey];
        if (!dayData || !dayData.tasks) break;
        
        const hasTask = dayData.tasks.some(t => 
          normalizeTaskName(t.text) === normalizedName && t.done
        );
        
        if (hasTask) {
          currentStreak++;
        } else {
          // If it's today, don't break — task might not be done yet
          const todayStr = getTodayKey();
          if (dateKey === todayStr) {
            // Skip today, don't count it but don't break
          } else {
            break;
          }
        }
        
        checkDate.setDate(checkDate.getDate() - 1);
      }
      
      if (currentStreak >= 3) {
        streaks[displayName] = currentStreak;
      }
    });
    
    return streaks;
  }

// Get autocomplete suggestions
  function getAutocompleteSuggestions(input) {
    if (input.length < 2) return [];
    
    const normalized = normalizeTaskName(input);
    const data = loadData();
    const taskCounts = new Map();
    
    Object.values(data).forEach(day => {
      if (day.tasks) {
        day.tasks.forEach(task => {
          const taskNormalized = normalizeTaskName(task.text);
          taskCounts.set(taskNormalized, (taskCounts.get(taskNormalized) || 0) + 1);
        });
      }
    });
    
    const suggestions = [];
    const seenNormalized = new Set();
    
    Object.values(data).forEach(day => {
      if (day.tasks) {
        day.tasks.forEach(task => {
          const taskNormalized = normalizeTaskName(task.text);
          if (taskCounts.get(taskNormalized) >= 3 && 
              taskNormalized.includes(normalized) &&
              !seenNormalized.has(taskNormalized)) {
            suggestions.push(task.text);
            seenNormalized.add(taskNormalized);
          }
        });
      }
    });
    
    return suggestions.slice(0, 5);
  }

  // Autocomplete state
  let selectedSuggestionIndex = -1;
  let currentSuggestions = [];

  // Handle task input change
  function handleTaskInputChange(e) {
    const input = e.target.value;
    const dropdown = document.getElementById('autocompleteDropdown');
    
    currentSuggestions = getAutocompleteSuggestions(input);
    selectedSuggestionIndex = -1;
    
    if (currentSuggestions.length > 0 && input.length >= 2) {
      dropdown.innerHTML = '';
      currentSuggestions.forEach((suggestion, idx) => {
        const div = document.createElement('div');
        div.className = 'autocomplete-item';
        const inputLower = input.toLowerCase();
        const suggestionLower = suggestion.toLowerCase();
        const matchIndex = suggestionLower.indexOf(inputLower);
        
        if (matchIndex !== -1) {
          const before = suggestion.substring(0, matchIndex);
          const match = suggestion.substring(matchIndex, matchIndex + input.length);

    const dropdown = document.getElementById('autocompleteDropdown');
    
    if (dropdown.style.display === 'block' && currentSuggestions.length > 0) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        selectedSuggestionIndex = Math.min(selectedSuggestionIndex + 1, currentSuggestions.length - 1);
        updateAutocompleteSelection();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        selectedSuggestionIndex = Math.max(selectedSuggestionIndex - 1, -1);
        updateAutocompleteSelection();
      } else if (e.key === 'Enter') {
        if (selectedSuggestionIndex >= 0) {
          e.preventDefault();
          e.target.value = currentSuggestions[selectedSuggestionIndex];
          dropdown.style.display = 'none';
          currentSuggestions = [];
          selectedSuggestionIndex = -1;
          return;
        }
      } else if (e.key === 'Escape') {
        dropdown.style.display = 'none';
        currentSuggestions = [];
        selectedSuggestionIndex = -1;
      }
    }
    
    if (e.key === 'Enter' && !e.shiftKey) {
      addTask();
    }
  }

  // Function to get color based on percentage
  function getProgressColor(pct) {
    if (pct < 50) {
      // Red to Yellow (0-50%)
      const ratio = pct / 50;
      const r = 220;
      const g = Math.round(50 + (200 * ratio)); // 50 to 250
      const b = 50;
      return `rgb(${r}, ${g}, ${b})`;
    } else {
      // Yellow to Green (50-100%)
      const ratio = (pct - 50) / 50;
      const r = Math.round(220 - (194 * ratio)); // 220 to 26
      const g = Math.round(250 - (173 * ratio)); // 250 to 77
      const b = Math.round(50 - (4 * ratio)); // 50 to 46
      return `rgb(${r}, ${g}, ${b})`;
    }
  }

  function makeEditable(textEl, detailEl, taskIndex, dayKey) {
    textEl.contentEditable = true;

    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    const save = () => {
      textEl.contentEditable = false;
      const newText = textEl.textContent.trim();
      const newDetail = detailEl ? detailEl.textContent.trim() : '';
      
      if (newText) {
        const day = getDay(dayKey);
        day.tasks[taskIndex].text = newText;

        saveDay(dayKey, day);

      else renderDayView(dayKey);
    };

  // Drag and drop state
  let draggedTaskIndex = null;

  function setupDragAndDrop(taskEl, taskIndex, dayKey) {
    taskEl.draggable = true;
    
    taskEl.addEventListener('dragstart', (e) => {
      draggedTaskIndex = taskIndex;
      currentDayKey = dayKey;
      taskEl.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    
    taskEl.addEventListener('dragend', (e) => {
      taskEl.classList.remove('dragging');
      document.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
    });
    
    taskEl.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      
      if (draggedTaskIndex !== taskIndex) {
        taskEl.classList.add('drag-over');
      }
    });
    
    taskEl.addEventListener('dragleave', (e) => {
      taskEl.classList.remove('drag-over');
    });
    
    taskEl.addEventListener('drop', (e) => {
      e.preventDefault();
      taskEl.classList.remove('drag-over');
      
      if (draggedTaskIndex !== null && draggedTaskIndex !== taskIndex) {
        const day = getDay(currentDayKey);
        const draggedTask = day.tasks[draggedTaskIndex];
        
        // Remove from old position
        day.tasks.splice(draggedTaskIndex, 1);
        
        // Insert at new position
        const newIndex = draggedTaskIndex < taskIndex ? taskIndex - 1 : taskIndex;
        day.tasks.splice(newIndex, 0, draggedTask);
        
        saveDay(currentDayKey, day);
        
        if (currentDayKey === todayKey) renderToday();
        else renderDayView(currentDayKey);
      }
      
      draggedTaskIndex = null;
      currentDayKey = null;
    });
  }

  function addResolution() {
    const inp = document.getElementById('resInput');
    const type = document.getElementById('resType').value;
    const targetInp = document.getElementById('resTarget');
    const title = inp.value.trim();
    if (!title) return;
    
    const res = loadResolutions();
    if (type === 'recurring') {
      const target = parseInt(targetInp.value) || 12;
      res.push({ title, type: 'recurring', current: 0, target, done: false, history: [] });
    } else {
      res.push({ title, type: 'onetime', done: false, history: [] });
    }
    saveResolutions(res);
    inp.value = '';
    renderResolutions();

    const res = loadResolutions();
    res[i].done = !res[i].done;
    saveResolutions(res);

  function adjustRecurring(i, delta) {
    const res = loadResolutions();
    const r = res[i];
    r.current = Math.max(0, Math.min(r.target, r.current + delta));
    r.done = r.current >= r.target;
    saveResolutions(res);
    renderResolutions();
  }

  function cancelEvolve() {
    evolveIndex = null;
    renderResolutions();
  }

  function submitEvolve(i) {
    const res = loadResolutions();
    const r = res[i];
    const newTitle = document.getElementById('evolveTitle').value.trim();
    if (!newTitle) return;

    const evolveTargetEl = document.getElementById('evolveTarget');
    const newTarget = evolveTargetEl ? (parseInt(evolveTargetEl.value) || r.target) : 0;

    // Move current goal into history
    if (!r.history) r.history = [];
    if (r.type === 'recurring') {
      r.history.push({ title: r.title, target: r.target, current: r.current });
    } else {
      r.history.push({ title: r.title });
    }

    // Set new goal
    r.title = newTitle;
    r.done = false;
    if (r.type === 'recurring') {
      r.target = newTarget;
      r.current = 0;
    }

    evolveIndex = null;
    saveResolutions(res);
    renderResolutions();
  }

  function renderResolutions() {
    const res = loadResolutions();
    const list = document.getElementById('resolutionList');
    list.innerHTML = '';

    // Show/hide target input based on type selection
    const typeSelect = document.getElementById('resType');
    const targetInput = document.getElementById('resTarget');
    typeSelect.onchange = () => {
      targetInput.style.display = typeSelect.value === 'recurring' ? 'block' : 'none';
    };
    targetInput.style.display = typeSelect.value === 'recurring' ? 'block' : 'none';

    if (res.length === 0) {
      list.innerHTML = '<div class="empty-state"><span class="e-icon">✦</span><p>No resolutions yet — add one above</p></div>';
      return;
    }

    // Overall progress
    const totalItems = res.length;
    const completedItems = res.filter(r => r.done).length;
    const overallPct = Math.round((completedItems / totalItems) * 100);
    const overallColor = getProgressColor(overallPct);

    const overallDiv = document.createElement('div');
    overallDiv.className = 'res-overall';
    overallDiv.innerHTML = `
      <div class="res-overall-header">
        <span class="res-overall-label">Overall Progress</span>
        <span class="res-overall-pct" style="color:${overallColor}">${completedItems}/${totalItems} — ${overallPct}%</span>
      </div>
      <div class="res-bar-track">
        <div class="res-bar-fill" style="width:${overallPct}%;background:${overallColor}"></div>
      </div>`;
    list.appendChild(overallDiv);

    res.forEach((r, i) => {
      const el = document.createElement('div');
      el.className = 'res-item' + (r.done ? ' completed' : '');
      const historyArr = r.history || [];

      if (r.type === 'recurring') {
        const pct = Math.round((r.current / r.target) * 100);
        const color = getProgressColor(pct);
        let html = `
          <div class="res-item-header">
            <div>
              <span class="res-item-title">${escHtml(r.title)}</span>
              <span class="res-type-tag">Recurring</span>
            </div>
            <div class="res-item-actions">
              <button class="res-btn" onclick="adjustRecurring(${i},-1)">−</button>
              <button class="res-btn" onclick="adjustRecurring(${i},1)">+</button>
              <button class="res-btn-del" onclick="deleteResolution(${i})">✕</button>
            </div>
          </div>
          <div class="res-progress-info">
            <span>${r.current} / ${r.target}</span>
            <span class="res-progress-pct" style="color:${color}">${pct}%</span>
          </div>
          <div class="res-bar-track">
            <div class="res-bar-fill" style="width:${pct}%;background:${color}"></div>
          </div>`;

        // Show evolve button or form when completed
        if (r.done && evolveIndex !== i) {
          html += `<button class="res-evolve-btn" onclick="showEvolveForm(${i})">↑ Set New Goal</button>`;
        }
        if (evolveIndex === i) {
          html += `
            <div class="res-evolve-form">
              <input type="text" id="evolveTitle" placeholder="New goal title…"/>
              <input type="number" id="evolveTarget" placeholder="${r.target}" min="1" value="${r.target}"/>
              <button onclick="submitEvolve(${i})">Go</button>
            </div>`;
        }

        // Show past goals
        if (historyArr.length > 0) {
          html += '<div class="res-history">';
          [...historyArr].reverse().forEach(h => {
            html += `<div class="res-history-item">
              <span>${escHtml(h.title)}</span>
              <span class="res-history-target">${h.target ? h.current + '/' + h.target : ''}</span>
            </div>`;
          });
          html += '</div>';
        }

        el.innerHTML = html;
      } else {
        // One-time resolution
        let html = `
          <div class="res-item-header">
            <div class="res-onetime-row">
              <div class="res-cb" onclick="toggleOnetimeRes(${i})">${r.done ? '✓' : ''}</div>
              <span class="res-item-title">${escHtml(r.title)}</span>
              <span class="res-type-tag">One-time</span>
            </div>
            <div class="res-item-actions">
              <button class="res-btn-del" onclick="deleteResolution(${i})">✕</button>
            </div>
          </div>`;

        // One-time can also evolve
        if (r.done && evolveIndex !== i) {
          html += `<button class="res-evolve-btn" onclick="showEvolveForm(${i})">↑ Set New Goal</button>`;
        }
        if (evolveIndex === i) {
          html += `
            <div class="res-evolve-form">
              <input type="text" id="evolveTitle" placeholder="New goal title…"/>
              <button onclick="submitEvolve(${i})">Go</button>
            </div>`;
        }

        // Show past goals
        if (historyArr.length > 0) {
          html += '<div class="res-history">';
          [...historyArr].reverse().forEach(h => {
            html += `<div class="res-history-item">
              <span>${escHtml(h.title)}</span>
            </div>`;
          });
          html += '</div>';
        }

        el.innerHTML = html;
      }

      list.appendChild(el);
    });
  }

  function launchConfetti(){
    const c=document.getElementById('confetti');
    const colors=['#1a4d2e','#2d6a4f','#52b788','#95d5b2','#40916c','#1b4332','#081c15'];
    
    for(let i=0;i<200;i++){
      const el=document.createElement('div');
      el.className='confetti-piece';
      el.style.left=Math.random()*100+'vw';
      el.style.animationDuration=(Math.random()*2.5+2)+'s';
      el.style.animationDelay=(Math.random()*1.5)+'s';
      const color=colors[Math.floor(Math.random()*colors.length)];
      const size=Math.random()*10+6;
      const shape=Math.random()>0.5?`width:${size}px;height:${size}px;background:${color};border-radius:50%`:`width:${size}px;height:${size*1.8}px;background:${color}`;
      el.style.cssText+=shape;
      c.appendChild(el);
      el.addEventListener('animationend',()=>el.remove());
    }
  }

  function escHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── CHESS.COM RATING ──
  async function fetchChessRating() {
    const container = document.getElementById('chessContent');
    try {
      const resp = await fetch('https://api.chess.com/pub/player/theokozak/stats');
      if (!resp.ok) throw new Error('API error');
      const data = await resp.json();
      
      const rapid = data.chess_rapid;
      if (!rapid || !rapid.last) {
        container.innerHTML = '<div class="chess-error">No rapid rating found</div>';
        return;
      }
      
      const rating = rapid.last.rating;
      const best = rapid.best ? rapid.best.rating : null;
      const wins = rapid.record ? rapid.record.win : 0;
      const losses = rapid.record ? rapid.record.loss : 0;
      const draws = rapid.record ? rapid.record.draw : 0;
      
      let html = `
        <div class="chess-rating-display">
          <span class="chess-rating-number">${rating}</span>
          <span class="chess-rating-label">Elo</span>
        </div>
        <div class="chess-record">
          <span style="color: var(--green);">${wins}W</span>
          <span style="color: #c0392b;">${losses}L</span>
          <span style="color: var(--muted);">${draws}D</span>
        </div>`;
      
      if (best) {
        html += `<div class="chess-peak">Peak: ${best} &nbsp;&nbsp;&nbsp;&nbsp; Jan 1: 891</div>`;
      }
      
      container.innerHTML = html;
    } catch (err) {
      container.innerHTML = '<div class="chess-error">Could not load rating</div>';
    }
  }
  
  fetchChessRating();

  renderToday();

  // ── GIST SYNC ──
  const GIST_FILE = 'theos-day.json';

  function getSyncCfg() {
    return {
      token: localStorage.getItem('theosGistToken') || '',
      gistId: localStorage.getItem('theosGistId') || ''
    };
  }

  function setSyncStatus(msg, cls) {
    const el = document.getElementById('syncStatus');
    if (!el) return;
    el.textContent = msg;
    el.className = 'sync-status' + (cls ? ' ' + cls : '');
  }

  function buildSnapshot() {
    const data = loadData();
    const key = getTodayKey();
    const day = data[key] || { tasks: [] };
    const tasks = day.tasks || [];
    const done = tasks.filter(t => t.done).length;
    const total = tasks.length;
    const pct = total ? Math.round((done / total) * 100) : 0;

    const streaks = Object.entries(calculateStreaks() || {})
      .map(([name, count]) => ({ name, count }))
      .sort((a, b) => b.count - a.count)
      .slice(0, 4);

    const res = loadResolutions();

    return {
      updated: new Date().toISOString(),
      date: key,
      pct: pct,
      done: done,
      total: total,
      tasks: tasks.map(t => ({ text: t.text, done: !!t.done })),
      streaks: streaks,
      resolutions: {
        done: res.filter(r => r.done).length,
        total: res.length
      }
    };
  }

  async function pushSnapshot() {
    const { token, gistId } = getSyncCfg();
    if (!token || !gistId) return false;

    const resp = await fetch('https://api.github.com/gists/' + gistId, {
      method: 'PATCH',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        files: { [GIST_FILE]: { content: JSON.stringify(buildSnapshot(), null, 2) } }
      })
    });
    if (!resp.ok) throw new Error('GitHub returned ' + resp.status);
    localStorage.setItem('theosGistLastSync', new Date().toISOString());
    return true;
  }

  // Debounced — a burst of checkbox taps produces one upload.
  let syncTimer = null;
  function queueSync() {
    const { token, gistId } = getSyncCfg();
    if (!token || !gistId) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => {
      pushSnapshot()
        .then(() => setSyncStatus('Synced ' + new Date().toLocaleTimeString(), 'ok'))
        .catch(err => setSyncStatus('Sync failed — ' + err.message, 'err'));
    }, 2500);
  }

  async function syncNow() {
    const { token, gistId } = getSyncCfg();
    if (!token) return setSyncStatus('Add a token first', 'err');
    if (!gistId) return setSyncStatus('Create a gist first', 'err');
    setSyncStatus('Syncing…');
    try {
      await pushSnapshot();
      setSyncStatus('Synced ' + new Date().toLocaleTimeString(), 'ok');
    } catch (err) {
      setSyncStatus('Sync failed — ' + err.message, 'err');
    }
  }

  async function createGist() {
    const token = document.getElementById('gistToken').value.trim();
    if (!token) return setSyncStatus('Add a token first', 'err');
    localStorage.setItem('theosGistToken', token);
    setSyncStatus('Creating gist…');
    try {
      const resp = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + token,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          description: "theo's day — widget data",
          public: false,
          files: { [GIST_FILE]: { content: JSON.stringify(buildSnapshot(), null, 2) } }
        })
      });
      if (!resp.ok) throw new Error('GitHub returned ' + resp.status);
      const gist = await resp.json();
      localStorage.setItem('theosGistId', gist.id);
      document.getElementById('gistId').value = gist.id;
      setSyncStatus('Gist created and synced', 'ok');
      showRawUrl(gist.id, gist.owner ? gist.owner.login : '');
    } catch (err) {
      setSyncStatus('Could not create gist — ' + err.message, 'err');
    }
  }

  function saveSyncSettings() {
    const token = document.getElementById('gistToken').value.trim();
    const gistId = document.getElementById('gistId').value.trim();
    localStorage.setItem('theosGistToken', token);
    localStorage.setItem('theosGistId', gistId);
    if (token && gistId) {
      setSyncStatus('Saved — tap Sync now to test', 'ok');
      showRawUrl(gistId, localStorage.getItem('theosGistOwner') || '');
    } else {
      setSyncStatus('Saved, but both fields are needed to sync');
    }
  }

  function showRawUrl(gistId, owner) {
    if (!gistId) return;
    if (owner) localStorage.setItem('theosGistOwner', owner);
    const who = owner || localStorage.getItem('theosGistOwner') || 'YOUR-USERNAME';
    const url = `https://gist.githubusercontent.com/${who}/${gistId}/raw/${GIST_FILE}`;
    document.getElementById('rawUrl').textContent = url;
    document.getElementById('rawUrlBlock').style.display = 'block';
  }

  function copyRawUrl() {
    const url = document.getElementById('rawUrl').textContent;
    navigator.clipboard.writeText(url)
      .then(() => setSyncStatus('URL copied', 'ok'))
      .catch(() => setSyncStatus('Select the URL and copy it manually', 'err'));
  }

  function initSyncScreen() {
    const { token, gistId } = getSyncCfg();
    document.getElementById('gistToken').value = token;
    document.getElementById('gistId').value = gistId;
    if (token && gistId) {
      const last = localStorage.getItem('theosGistLastSync');
      setSyncStatus(last ? 'Last synced ' + new Date(last).toLocaleString() : 'Ready', 'ok');
      showRawUrl(gistId, localStorage.getItem('theosGistOwner') || '');
    }
  }
  initSyncScreen();

  // ── SERVICE WORKER ──
  // Needs HTTPS (or localhost). Silently does nothing if opened as a file://.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => {
        console.log('Service worker registration failed:', err);
      });
    });

    // When a new version takes over, reload once so you're not left on the old one.
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      location.reload();
    });
  }
</script>
